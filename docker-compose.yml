# ProfitPilot — single-command demo (SPEC 26): `docker compose up --build`
#
# One container builds the SPA and serves it together with the API on http://localhost:8000.
# Offline by design: no external services, no network calls at runtime, everything baked in.
#
#   docker compose up --build      → app on :8000   (API docs at /api/docs)
#   docker compose down            → stop
#
# The demo database lives in a named volume so `docker compose down` does not re-seed needlessly;
# delete the volume (`docker compose down -v`) for a fresh first-boot seed.

services:
  profitpilot:
    build:
      context: .
      dockerfile: Dockerfile
    image: profitpilot:1.0.0
    container_name: profitpilot
    ports:
      - "8000:8000"
    environment:
      # DEMO mode: every value has a safe default, no secrets required.
      APP_ENV: demo
      DATABASE_URL: sqlite:////data/profitpilot.db
      MODEL_PATH: /app/data/models/v1.json
      DATA_SEED: "20260928"
      JWT_EXPIRE_MINUTES: "60"
      RATE_LIMIT_AUTH: 10/minute
      RATE_LIMIT_SIM: 60/minute
      RATE_LIMIT_DEFAULT: 300/minute
      MAX_PRICE_MOVE: "0.12"
      ALLOW_FAULTS: "true"
      LOG_LEVEL: INFO
      # Origin the browser will use; add your host if you expose this beyond localhost.
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    volumes:
      - profitpilot-db:/data
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  profitpilot-db:
